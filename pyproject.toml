[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastopt"
version = "0.1.0"
description = "High-performance tensor-level automatic differentiation and optimization framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.10",
    "casadi>=3.6",
    "pymoo>=0.6.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.packages.find]
where = ["python"]
include = ["fastopt*"]

[tool.setuptools.package-data]
"*" = ["*.pyd", "*.so", "*.dylib", "*.dll", "*.pyi", "py.typed"]
